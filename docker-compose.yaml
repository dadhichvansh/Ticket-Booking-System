services:
  postgres:
    image: postgres:16
    container_name: ticketbooking-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Files run once, in name order, only when the data volume is empty
      - ./db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/seed/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  mock-payment:
    build: ./mock-payment
    image: ticketbooking-mock-payment
    container_name: ticketbooking-mock-payment
    environment:
      PORT: 4000
      LOG_LEVEL: info
      DB_PATH: /data/mock.db
    ports:
      # Localhost only, for my curl tests. Not reachable from other machines.
      - '127.0.0.1:4000:4000'
    volumes:
      - mockdata:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  mockdata:
